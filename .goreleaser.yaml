# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
#
# Local packaging only. CI does not run GoReleaser: the GitHub release is
# source-only, and GitHub attaches the source tarball and zipball to it itself
# (see .github/workflows/release.yml). Use this config to produce archives,
# .deb and .rpm for your own machine:
#
#   goreleaser build   --snapshot --clean   # binaries into dist/
#   goreleaser release --snapshot --clean   # plus archives, .deb and .rpm
#
# `release.disable` is deliberate: no binary is ever uploaded to a GitHub
# release, from here or from anywhere else.
version: 2

project_name: mail_cli

release:
  disable: true

before:
  hooks:
    - go mod tidy
    # Regenerate the shell completions into completions/ so the archive below
    # can ship them. The directory is gitignored; it is a build artifact.
    - ./tools/gen_completions.sh

builds:
  - id: mail_cli
    main: .
    binary: mail_cli
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w

archives:
  - id: default
    format: tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - LICENSE
      - docs/*
      - examples/*
      # Tab-completion scripts, generated by the before hook above. Explicit
      # src/dst pairs so each lands at a conventional path in the archive.
      - src: completions/mail_cli.bash
        dst: completions/mail_cli.bash
      - src: completions/_mail_cli
        dst: completions/_mail_cli
      - src: completions/mail_cli.fish
        dst: completions/mail_cli.fish

nfpms:
  - id: packages
    package_name: mail_cli
    vendor: "Sariel Har-Peled"
    homepage: "https://github.com/sarielhp/mail_cli"
    maintainer: "Sariel Har-Peled <sariel@gmail.com>"
    description: "Modern API-first terminal email client for Gmail, Microsoft 365, and Fastmail."
    license: "MIT"
    formats:
      - deb
      - rpm
    bindir: /usr/bin
    # The same three completion scripts the archives ship, installed where each
    # shell looks for them. They are generated by the before hook above.
    contents:
      - src: completions/mail_cli.bash
        dst: /usr/share/bash-completion/completions/mail_cli
      - src: completions/_mail_cli
        dst: /usr/share/zsh/site-functions/_mail_cli
      - src: completions/mail_cli.fish
        dst: /usr/share/fish/vendor_completions.d/mail_cli.fish

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - Merge pull request
      - Merge branch
